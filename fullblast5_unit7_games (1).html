<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Blast 5 · Unit 7 · Vocabulary Games</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13003a;
  --bg2: #1e0050;
  --card: #240060;
  --border: #4a0090;
  --ink: #f0e8ff;
  --muted: #9b7fd4;
  --A: #ff4757;
  --B: #2ed573;
  --C: #1e90ff;
  --D: #ffa502;
  --gold: #ffd700;
  --correct: #2ed573;
  --wrong: #ff4757;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── BG EFFECTS ── */
.bg-stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-stars span{
  position:absolute;border-radius:50%;background:#fff;
  animation:twink var(--d,3s) ease-in-out infinite;
  opacity:var(--o,.3);
}
@keyframes twink{0%,100%{opacity:var(--o,.3);}50%{opacity:calc(var(--o,.3)*3);}}
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(138,43,226,.25) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 80%,rgba(255,71,87,.15) 0%,transparent 55%),
    radial-gradient(ellipse at 60% 10%,rgba(30,144,255,.18) 0%,transparent 45%);
}

/* ── LAYOUT ── */
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:24px 16px 60px;}

/* ── TOP HEADER ── */
.top-bar{
  text-align:center;margin-bottom:32px;
  animation:dropIn .7s cubic-bezier(.22,1,.36,1) both;
}
@keyframes dropIn{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}
.top-bar .label{
  display:inline-block;
  background:rgba(138,43,226,.35);
  border:1px solid rgba(138,43,226,.6);
  border-radius:20px;padding:5px 18px;
  font-size:12px;font-weight:800;letter-spacing:2px;
  color:#c89fff;text-transform:uppercase;margin-bottom:14px;
}
.top-bar h1{
  font-family:'Lilita One',cursive;
  font-size:clamp(28px,6vw,52px);
  color:#fff;line-height:1.1;margin-bottom:6px;
  text-shadow:0 0 40px rgba(138,43,226,.8);
}
.top-bar h1 em{font-style:normal;color:var(--gold);}
.top-bar p{font-size:14px;color:var(--muted);font-weight:700;}

/* ── TAB SWITCHER ── */
.tabs{
  display:flex;gap:8px;justify-content:center;
  margin-bottom:28px;
  animation:dropIn .7s ease .15s both;
}
.tab-btn{
  flex:1;max-width:200px;
  padding:14px 20px;border-radius:16px;border:2px solid transparent;
  font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;
  cursor:pointer;transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tab-btn.kahoot-tab{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;box-shadow:0 4px 20px rgba(124,58,237,.4);
}
.tab-btn.memory-tab{
  background:linear-gradient(135deg,#0f766e,#2dd4bf);
  color:#fff;box-shadow:0 4px 20px rgba(45,212,191,.35);
}
.tab-btn:not(.active){background:var(--card);border-color:var(--border);color:var(--muted);box-shadow:none;}
.tab-btn:hover{transform:translateY(-2px);}

/* ── PANELS ── */
.panel{display:none;animation:fadeUp .4s ease both;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ════════════════════════════════
   KAHOOT QUIZ
════════════════════════════════ */
.quiz-header{
  background:linear-gradient(135deg,#4c1d95,#7c3aed);
  border-radius:24px;padding:28px 32px;
  margin-bottom:20px;text-align:center;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(124,58,237,.4);
}
.quiz-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.08),transparent 60%);
}
.q-meta{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.q-num{font-size:13px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:1px;}
.q-score-box{
  background:rgba(255,255,255,.15);border-radius:12px;
  padding:6px 16px;font-size:14px;font-weight:800;color:#fff;
}
.timer-ring{
  position:relative;width:64px;height:64px;margin:0 auto 16px;
}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle.track{fill:none;stroke:rgba(255,255,255,.15);stroke-width:5;}
.timer-ring circle.fill{
  fill:none;stroke:var(--gold);stroke-width:5;
  stroke-dasharray:163;stroke-dashoffset:0;
  transition:stroke-dashoffset .9s linear,stroke .3s;
  stroke-linecap:round;
}
.timer-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Lilita One',cursive;font-size:22px;color:#fff;
}
.q-text{
  position:relative;
  font-family:'Lilita One',cursive;
  font-size:clamp(18px,3.5vw,26px);
  color:#fff;line-height:1.3;
}

/* Answer grid */
.answers-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin-bottom:16px;
}
.ans-btn{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;border-radius:18px;border:none;
  font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;
  color:#fff;cursor:pointer;
  transition:transform .15s,box-shadow .15s,opacity .3s;
  text-align:left;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.ans-btn:hover{transform:scale(1.02);filter:brightness(1.1);}
.ans-btn:active{transform:scale(.98);}
.ans-A{background:linear-gradient(135deg,#c0392b,var(--A));}
.ans-B{background:linear-gradient(135deg,#1e8449,var(--B));}
.ans-C{background:linear-gradient(135deg,#1565c0,var(--C));}
.ans-D{background:linear-gradient(135deg,#b7600a,var(--D));}
.ans-shape{
  width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;
  background:rgba(255,255,255,.2);border-radius:8px;
}
.ans-btn.correct-ans{
  outline:4px solid #fff;
  box-shadow:0 0 0 4px var(--correct),0 0 30px var(--correct);
  animation:correctPop .4s ease;
}
.ans-btn.wrong-ans{
  opacity:.5;transform:scale(.97);
}
@keyframes correctPop{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}

/* feedback bar */
.q-feedback{
  min-height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:18px;font-weight:800;padding:12px 20px;
  transition:all .3s;margin-bottom:16px;
}
.q-feedback.hidden{opacity:0;pointer-events:none;}
.q-feedback.ok{background:rgba(46,213,115,.15);border:2px solid var(--correct);color:var(--correct);}
.q-feedback.no{background:rgba(255,71,87,.15);border:2px solid var(--wrong);color:var(--wrong);}

.next-btn{
  display:block;width:100%;padding:16px;border-radius:16px;border:none;
  font-family:'Lilita One',cursive;font-size:20px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;cursor:pointer;
  box-shadow:0 4px 20px rgba(124,58,237,.5);
  transition:all .2s;
}
.next-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.next-btn:disabled{opacity:.3;cursor:default;transform:none;}

/* Final score */
.quiz-final{
  background:linear-gradient(135deg,#1a0050,#3b0080);
  border-radius:28px;padding:44px 32px;
  text-align:center;
  box-shadow:0 8px 40px rgba(124,58,237,.5);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
.final-trophy{font-size:72px;margin-bottom:16px;animation:bounce 1s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.final-score{
  font-family:'Lilita One',cursive;
  font-size:clamp(48px,10vw,80px);
  background:linear-gradient(135deg,#ffd700,#ff9500);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin:8px 0;
}
.final-msg{font-size:20px;font-weight:800;color:#fff;margin-bottom:24px;}
.final-breakdown{
  display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:28px;
}
.fbd{
  background:rgba(255,255,255,.08);border-radius:14px;
  padding:10px 20px;font-size:14px;font-weight:700;
}
.restart-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 36px;border-radius:16px;border:none;
  font-family:'Lilita One',cursive;font-size:20px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#1a0000;cursor:pointer;
  box-shadow:0 4px 20px rgba(251,191,36,.4);
  transition:all .2s;
}
.restart-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}

/* ════════════════════════════════
   MEMORY GAME
════════════════════════════════ */
.memory-top{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:18px 24px;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.mem-stat{text-align:center;}
.mem-stat .sv{
  font-family:'Lilita One',cursive;font-size:28px;color:#fff;
}
.mem-stat .sl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.mem-restart{
  padding:10px 22px;border-radius:12px;border:none;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;
  background:linear-gradient(135deg,#0f766e,#2dd4bf);
  color:#fff;cursor:pointer;transition:all .2s;
}
.mem-restart:hover{transform:translateY(-2px);}

.mem-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}
@media(max-width:600px){.mem-grid{grid-template-columns:repeat(4,1fr);gap:8px;}}

.mem-card{
  aspect-ratio:1/1.2;
  perspective:600px;cursor:pointer;
}
.mem-card-inner{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.mem-card.flipped .mem-card-inner,
.mem-card.matched .mem-card-inner{
  transform:rotateY(180deg);
}
.mem-face{
  position:absolute;inset:0;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  font-size:13px;font-weight:800;text-align:center;padding:8px;
  line-height:1.2;
}
.mem-back{
  background:linear-gradient(135deg,#2e1065,#4c1d95);
  border:2px solid #7c3aed;
  color:#a78bfa;font-size:22px;
}
.mem-back::after{content:'?';}
.mem-front{
  background:linear-gradient(135deg,#064e3b,#0f766e);
  border:2px solid #2dd4bf;
  color:#fff;
  transform:rotateY(180deg);
  font-size:12px;
}
.mem-front.ukr{
  background:linear-gradient(135deg,#1e3a5f,#1d4ed8);
  border:2px solid #60a5fa;
}
.mem-card.matched .mem-face{
  opacity:1;
}
.mem-card.matched .mem-back{
  background:linear-gradient(135deg,#064e3b,#15803d);
  border-color:var(--correct);
}
.mem-card.matched .mem-front{
  background:linear-gradient(135deg,#064e3b,#15803d);
  border-color:var(--correct);
}
.mem-card.wrong-flash .mem-card-inner{animation:wrongShake .4s ease;}
@keyframes wrongShake{0%{transform:rotateY(180deg);}25%{transform:rotateY(180deg) translateX(-5px);}75%{transform:rotateY(180deg) translateX(5px);}100%{transform:rotateY(180deg);}}

.mem-complete{
  background:linear-gradient(135deg,#064e3b,#0f766e);
  border-radius:24px;padding:36px 28px;
  text-align:center;margin-top:20px;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.mem-complete h2{font-family:'Lilita One',cursive;font-size:32px;color:#fff;margin-bottom:8px;}
.mem-complete p{font-size:16px;color:#6ee7b7;font-weight:700;}

/* ── CONFETTI ── */
.confetti-piece{
  position:fixed;width:10px;height:10px;
  border-radius:2px;z-index:999;pointer-events:none;
  animation:confettiFall var(--cf-dur,2s) ease-in var(--cf-delay,0s) forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotateZ(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotateZ(720deg);opacity:0;}
}
</style>
</head>
<body>

<div class="bg-stars" id="stars"></div>
<div class="bg-glow"></div>

<div class="app">
  <!-- Header -->
  <div class="top-bar">
    <div class="label">📗 Full Blast 5 · Unit 7</div>
    <h1>What an <em>Experience!</em></h1>
    <p>Vocabulary Games · Feelings & Experiences</p>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn kahoot-tab active" onclick="switchTab('kahoot')">🎯 Kahoot Quiz</button>
    <button class="tab-btn memory-tab" onclick="switchTab('memory')">🃏 Memory Game</button>
  </div>

  <!-- ══ KAHOOT PANEL ══ -->
  <div class="panel active" id="kahoot-panel">
    <div id="quiz-area"></div>
  </div>

  <!-- ══ MEMORY PANEL ══ -->
  <div class="panel" id="memory-panel">
    <div class="memory-top">
      <div class="mem-stat"><div class="sv" id="m-moves">0</div><div class="sl">Moves</div></div>
      <div class="mem-stat"><div class="sv" id="m-pairs">0/15</div><div class="sl">Pairs Found</div></div>
      <div class="mem-stat"><div class="sv" id="m-time">0:00</div><div class="sl">Time</div></div>
      <button class="mem-restart" onclick="initMemory()">🔄 New Game</button>
    </div>
    <div class="mem-grid" id="mem-grid"></div>
    <div id="mem-complete" style="display:none"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  VOCABULARY DATA — Full Blast 5 Unit 7
// ══════════════════════════════════════
const vocab = [
  { en: 'scared',      uk: 'наляканий' },
  { en: 'excited',     uk: 'схвильований' },
  { en: 'surprised',   uk: 'здивований' },
  { en: 'bored',       uk: 'нудьгуючий' },
  { en: 'terrified',   uk: 'жахливо наляканий' },
  { en: 'amazed',      uk: 'вражений' },
  { en: 'upset',       uk: 'засмучений' },
  { en: 'nervous',     uk: 'нервовий' },
  { en: 'embarrassed', uk: 'збентежений' },
  { en: 'thrilling',   uk: 'захопливий' },
  { en: 'frightening', uk: 'страшний' },
  { en: 'amazing',     uk: 'дивовижний' },
  { en: 'boring',      uk: 'нудний' },
  { en: 'horror film', uk: 'фільм жахів' },
  { en: 'adventure',   uk: 'пригода' },
];

// ══════════════════════════════════════
//  STARS BACKGROUND
// ══════════════════════════════════════
(function(){
  const sf = document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s=document.createElement('span');
    const sz=Math.random()*2.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${.15+Math.random()*.5};animation-delay:${Math.random()*5}s`;
    sf.appendChild(s);
  }
})();

// ══════════════════════════════════════
//  TAB SWITCHER
// ══════════════════════════════════════
function switchTab(which){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.'+which+'-tab').classList.add('active');
  document.getElementById(which+'-panel').classList.add('active');
}

// ══════════════════════════════════════
//  KAHOOT QUIZ
// ══════════════════════════════════════
let questions=[], qIdx=0, score=0, correct=0, wrong=0, timer=null, timeLeft=15;
const SHAPES=['▲','◆','●','★'];
const LABELS=['A','B','C','D'];

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

function buildQuestions(){
  // For each vocab, ask "What does X mean?" or "How do you say Y in English?"
  const qs=[];
  shuffle(vocab).forEach((v,i)=>{
    if(i%2===0){
      // EN → UK
      const wrongs=shuffle(vocab.filter(x=>x.uk!==v.uk)).slice(0,3).map(x=>x.uk);
      const opts=shuffle([v.uk,...wrongs]);
      qs.push({q:`What does "<b>${v.en}</b>" mean?`, correct:v.uk, opts});
    } else {
      // UK → EN
      const wrongs=shuffle(vocab.filter(x=>x.en!==v.en)).slice(0,3).map(x=>x.en);
      const opts=shuffle([v.en,...wrongs]);
      qs.push({q:`How do you say "<b>${v.uk}</b>" in English?`, correct:v.en, opts});
    }
  });
  return shuffle(qs);
}

function initQuiz(){
  questions=buildQuestions();
  qIdx=0;score=0;correct=0;wrong=0;
  renderQuestion();
}

function renderQuestion(){
  const qa=document.getElementById('quiz-area');
  if(qIdx>=questions.length){renderFinal(qa);return;}
  const q=questions[qIdx];
  const colors=['ans-A','ans-B','ans-C','ans-D'];
  qa.innerHTML=`
    <div class="quiz-header">
      <div class="q-meta">
        <div class="q-num">Question ${qIdx+1} / ${questions.length}</div>
        <div class="q-score-box">⭐ ${score} pts</div>
      </div>
      <div class="timer-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="track" cx="32" cy="32" r="26"/>
          <circle class="fill" id="timer-fill" cx="32" cy="32" r="26"/>
        </svg>
        <div class="timer-num" id="timer-num">15</div>
      </div>
      <div class="q-text">${q.q}</div>
    </div>
    <div class="answers-grid">
      ${q.opts.map((o,i)=>`
        <button class="ans-btn ${colors[i]}" onclick="pick(this,'${o.replace(/'/g,"\\'")}')">
          <span class="ans-shape">${SHAPES[i]}</span>
          <span>${o}</span>
        </button>
      `).join('')}
    </div>
    <div class="q-feedback hidden" id="q-fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()" disabled>
      ${qIdx===questions.length-1 ? '🏆 See Results!' : 'Next Question →'}
    </button>
  `;
  startTimer(q.correct);
}

function startTimer(correctAns){
  timeLeft=15;
  clearInterval(timer);
  updateTimerUI();
  timer=setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft<=0){
      clearInterval(timer);
      timeOut(correctAns);
    }
  },1000);
}

function updateTimerUI(){
  const fill=document.getElementById('timer-fill');
  const num=document.getElementById('timer-num');
  if(!fill||!num) return;
  const pct=timeLeft/15;
  fill.style.strokeDashoffset=163*(1-pct);
  fill.style.stroke=timeLeft>8?'#ffd700':timeLeft>4?'#ffa502':'#ff4757';
  num.textContent=timeLeft;
}

function timeOut(correctAns){
  disableAnswers();
  markCorrect(correctAns);
  wrong++;
  showFb(false,'⏰ Time\'s up! The answer was: '+correctAns);
  document.getElementById('next-btn').disabled=false;
}

function pick(btn,chosen){
  clearInterval(timer);
  disableAnswers();
  const q=questions[qIdx];
  if(chosen===q.correct){
    btn.classList.add('correct-ans');
    const pts=Math.max(50,Math.round(500*timeLeft/15));
    score+=pts;correct++;
    showFb(true,'✅ Correct! +'+pts+' points');
  } else {
    btn.classList.add('wrong-ans');
    markCorrect(q.correct);
    wrong++;
    showFb(false,'❌ Wrong! Correct: '+q.correct);
  }
  document.getElementById('next-btn').disabled=false;
}

function markCorrect(ans){
  document.querySelectorAll('.ans-btn').forEach(b=>{
    if(b.querySelector('span:last-child').textContent.trim()===ans){
      b.classList.add('correct-ans');
    }
  });
}

function disableAnswers(){
  document.querySelectorAll('.ans-btn').forEach(b=>{b.onclick=null;b.style.cursor='default';});
}

function showFb(ok,msg){
  const fb=document.getElementById('q-fb');
  fb.className='q-feedback '+(ok?'ok':'no');
  fb.innerHTML=msg;
}

function nextQ(){
  qIdx++;
  renderQuestion();
}

function renderFinal(qa){
  const pct=Math.round(correct/questions.length*100);
  let emoji='😅',msg='Keep practising!';
  if(pct===100){emoji='🏆';msg='Perfect Score! Incredible!';}
  else if(pct>=80){emoji='🌟';msg='Excellent work!';}
  else if(pct>=60){emoji='👏';msg='Good job!';}
  else if(pct>=40){emoji='💪';msg='Keep going!';}
  qa.innerHTML=`
    <div class="quiz-final">
      <div class="final-trophy">${emoji}</div>
      <div style="font-size:16px;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:4px;">FINAL SCORE</div>
      <div class="final-score">${score}</div>
      <div class="final-msg">${msg}</div>
      <div class="final-breakdown">
        <div class="fbd" style="color:var(--correct)">✅ Correct: ${correct}/${questions.length}</div>
        <div class="fbd" style="color:var(--wrong)">❌ Wrong: ${wrong}/${questions.length}</div>
        <div class="fbd" style="color:var(--gold)">🎯 Accuracy: ${pct}%</div>
      </div>
      <button class="restart-btn" onclick="initQuiz()">🔄 Play Again</button>
    </div>
  `;
  if(pct>=80) confetti();
}

// ══════════════════════════════════════
//  MEMORY GAME
// ══════════════════════════════════════
let memCards=[], memFlipped=[], memMatched=0, memMoves=0, memTimer=null, memSecs=0, memLocked=false;

function initMemory(){
  clearInterval(memTimer);
  memMatched=0;memMoves=0;memSecs=0;memLocked=false;memFlipped=[];
  document.getElementById('m-moves').textContent='0';
  document.getElementById('m-pairs').textContent='0/15';
  document.getElementById('m-time').textContent='0:00';
  document.getElementById('mem-complete').style.display='none';

  // Build pairs: EN card + UK card
  const pairs=[];
  vocab.forEach(v=>{
    pairs.push({id:v.en, text:v.en, type:'en'});
    pairs.push({id:v.en, text:v.uk, type:'uk'});
  });
  memCards=shuffle(pairs);

  const grid=document.getElementById('mem-grid');
  grid.innerHTML='';
  memCards.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='mem-card';
    card.dataset.idx=i;
    card.dataset.id=c.id;
    card.dataset.type=c.type;
    card.innerHTML=`
      <div class="mem-card-inner">
        <div class="mem-face mem-back"></div>
        <div class="mem-face mem-front ${c.type==='uk'?'ukr':''}">${c.text}</div>
      </div>`;
    card.addEventListener('click',()=>flipCard(card));
    grid.appendChild(card);
  });

  memTimer=setInterval(()=>{
    memSecs++;
    const m=Math.floor(memSecs/60);
    const s=memSecs%60;
    document.getElementById('m-time').textContent=m+':'+(s<10?'0':'')+s;
  },1000);
}

function flipCard(card){
  if(memLocked) return;
  if(card.classList.contains('flipped')||card.classList.contains('matched')) return;
  if(memFlipped.length===2) return;

  card.classList.add('flipped');
  memFlipped.push(card);

  if(memFlipped.length===2){
    memMoves++;
    document.getElementById('m-moves').textContent=memMoves;
    memLocked=true;
    const [a,b]=memFlipped;
    if(a.dataset.id===b.dataset.id && a.dataset.type!==b.dataset.type){
      // Match!
      setTimeout(()=>{
        a.classList.add('matched');
        b.classList.add('matched');
        memMatched++;
        document.getElementById('m-pairs').textContent=memMatched+'/15';
        memFlipped=[];
        memLocked=false;
        if(memMatched===15) memComplete();
      },500);
    } else {
      // No match
      setTimeout(()=>{
        a.classList.add('wrong-flash');
        b.classList.add('wrong-flash');
        setTimeout(()=>{
          a.classList.remove('flipped','wrong-flash');
          b.classList.remove('flipped','wrong-flash');
          memFlipped=[];
          memLocked=false;
        },400);
      },700);
    }
  }
}

function memComplete(){
  clearInterval(memTimer);
  const m=Math.floor(memSecs/60);
  const s=memSecs%60;
  const timeStr=m+':'+(s<10?'0':'')+s;
  const box=document.getElementById('mem-complete');
  box.style.display='block';
  box.innerHTML=`
    <div class="mem-complete">
      <h2>🎉 All Pairs Found!</h2>
      <p>⏱ Time: ${timeStr} &nbsp;|&nbsp; 🔄 Moves: ${memMoves}</p>
      <p style="margin-top:10px;color:#fff;font-size:14px;">
        ${memMoves<=20?'🏆 Amazing efficiency!':memMoves<=30?'🌟 Great job!':'💪 Well done!'}
      </p>
    </div>`;
  confetti();
}

// ══════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════
function confetti(){
  const colors=['#ffd700','#ff4757','#2ed573','#1e90ff','#a855f7','#ff9500','#fff'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.cssText=`
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      --cf-dur:${1.5+Math.random()*2}s;
      --cf-delay:${Math.random()*.8}s;
      border-radius:${Math.random()>.5?'50%':'2px'};
    `;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3500);
  }
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
initQuiz();
initMemory();
</script>

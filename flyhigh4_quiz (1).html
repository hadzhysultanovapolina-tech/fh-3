<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fly High 4 – Vocabulary Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --sky:#1565C0;--sky2:#1976D2;--sky3:#42A5F5;--sky-light:#E3F2FD;
  --gold:#F9A825;--gold2:#F57F17;
  --green:#2E7D32;--green-l:#E8F5E9;--green-b:#43A047;
  --red:#C62828;--red-l:#FFEBEE;--red-b:#E53935;
  --purple:#6A1B9A;--purple-l:#F3E5F5;--purple-b:#8E24AA;
  --teal:#00695C;--teal-l:#E0F2F1;--teal-b:#00897B;
  --orange:#E65100;--orange-l:#FFF3E0;--orange-b:#EF6C00;
  --bg:#F5F9FF;--card:#FFFFFF;--text:#0D1B2A;--muted:#546E7A;
  --border:#CFE1F5;--r:16px;--rs:10px;
}

body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#0D47A1 0%,#1565C0 50%,#0277BD 100%);padding:1.8rem 1rem 0;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 200px 100px at 15% 30%,rgba(255,255,255,0.06) 0%,transparent 70%),radial-gradient(ellipse 150px 80px at 80% 20%,rgba(255,255,255,0.05) 0%,transparent 70%)}
.logo{font-family:'Baloo 2',cursive;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;color:#fff;letter-spacing:-0.5px;position:relative}
.logo em{color:var(--gold);font-style:normal}
.tagline{color:rgba(255,255,255,0.75);font-size:0.88rem;font-weight:600;margin:.3rem 0 1.2rem;position:relative}

/* ── UNIT TABS ── */
.tabs{display:flex;justify-content:center;gap:6px;padding:0 1rem;position:relative;flex-wrap:wrap}
.tab{padding:.55rem 1.3rem;border:2px solid rgba(255,255,255,0.4);border-bottom:none;border-radius:12px 12px 0 0;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .18s}
.tab:hover{background:rgba(255,255,255,0.25);color:#fff}
.tab.on{background:#fff;color:var(--sky);border-color:#fff}

/* ── MAIN ── */
main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* ── SECTION ── */
.sec{display:none}.sec.on{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.sec-head{margin-bottom:1.2rem}
.sec-title{font-family:'Baloo 2',cursive;font-size:1.5rem;font-weight:800;color:var(--text)}
.sec-sub{font-size:.88rem;color:var(--muted);font-weight:600;margin-top:.2rem}

/* ── PROGRESS BAR ── */
.prog-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:.7rem 1.1rem;margin-bottom:1.2rem}
.prog-label{font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.prog-track{flex:1;height:9px;background:var(--border);border-radius:9px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky2),var(--sky3));border-radius:9px;transition:width .4s ease}
.prog-score{font-size:1.25rem;font-weight:900;color:var(--sky);white-space:nowrap}

/* ── QUESTION CARD ── */
.qcard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:1.6rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(21,101,192,.07)}
.qbadge{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:.8rem;background:var(--sky-light);color:var(--sky2)}
.qtext{font-family:'Baloo 2',cursive;font-size:clamp(1.05rem,2.8vw,1.3rem);font-weight:700;line-height:1.45;margin-bottom:1.2rem}
.qtext .blank{display:inline-block;min-width:60px;border-bottom:2.5px solid var(--sky3);color:var(--sky);font-style:italic}

/* ── OPTIONS ── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{display:flex;align-items:center;gap:9px;padding:.75rem .95rem;background:var(--bg);border:2px solid var(--border);border-radius:var(--rs);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);cursor:pointer;text-align:left;transition:all .14s;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--sky2);background:var(--sky-light);transform:translateY(-1px);box-shadow:0 3px 8px rgba(21,101,192,.12)}
.opt .ltr{min-width:26px;height:26px;border-radius:50%;background:var(--sky2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0}
.opt.ok{border-color:var(--green-b);background:var(--green-l)}.opt.ok .ltr{background:var(--green-b)}
.opt.bad{border-color:var(--red-b);background:var(--red-l)}.opt.bad .ltr{background:var(--red-b)}
.opt:disabled{cursor:default;transform:none}

/* ── FEEDBACK ── */
.fb{margin-top:.9rem;padding:.65rem 1rem;border-radius:var(--rs);font-weight:700;font-size:.95rem;display:none;align-items:center;gap:8px}
.fb.show{display:flex}
.fb.ok{background:var(--green-l);color:var(--green);border:1.5px solid rgba(67,160,71,.3)}
.fb.bad{background:var(--red-l);color:var(--red);border:1.5px solid rgba(229,57,53,.3)}

/* ── NEXT BTN ── */
.nxt{display:none;margin:.9rem auto 0;padding:.7rem 2.2rem;background:var(--sky2);color:#fff;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(21,101,192,.3)}
.nxt.show{display:block}
.nxt:hover{background:var(--sky3);transform:translateY(-2px)}

/* ── RESULT ── */
.result{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:2.2rem 1.5rem;text-align:center;display:none;box-shadow:0 4px 18px rgba(21,101,192,.09)}
.result.show{display:block;animation:pop .4s ease}
.r-emoji{font-size:3.5rem;margin-bottom:.8rem}
.r-title{font-family:'Baloo 2',cursive;font-size:1.9rem;font-weight:900;margin-bottom:.4rem}
.r-sub{font-size:.95rem;color:var(--muted);font-weight:600;margin-bottom:1rem}
.r-big{font-size:2.8rem;font-weight:900;color:var(--sky);margin-bottom:.2rem}
.retry{margin-top:1rem;padding:.75rem 2.2rem;background:var(--sky2);color:#fff;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(21,101,192,.3)}
.retry:hover{background:var(--sky3);transform:translateY(-2px)}

/* ── MATCHING ── */
.match-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 2px 12px rgba(21,101,192,.07)}
.match-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.match-info{font-size:.88rem;font-weight:700;color:var(--muted)}
.match-reset{padding:.4rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .14s}
.match-reset:hover{border-color:var(--sky3);color:var(--sky2)}
.match-set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.mstab{padding:.4rem .9rem;border:1.5px solid var(--border);border-radius:20px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--bg);cursor:pointer;transition:all .14s}
.mstab:hover{border-color:var(--sky3);color:var(--sky2)}
.mstab.on{background:var(--sky2);color:#fff;border-color:var(--sky2)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col-lbl{text-align:center;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.match-col{display:flex;flex-direction:column;gap:8px}
.mi{padding:.65rem .9rem;background:var(--bg);border:2px solid var(--border);border-radius:var(--rs);font-weight:700;font-size:.92rem;text-align:center;cursor:pointer;transition:all .14s;user-select:none;line-height:1.3}
.mi:hover:not(.matched):not(.dis){border-color:var(--sky3);transform:translateY(-2px);box-shadow:0 3px 8px rgba(21,101,192,.12)}
.mi.sel{border-color:var(--purple-b);background:var(--purple-l);box-shadow:0 0 0 3px rgba(142,36,170,.2)}
.mi.matched{border-color:var(--green-b);background:var(--green-l);cursor:default;opacity:.75}
.mi.flash-bad{border-color:var(--red-b);background:var(--red-l);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media(max-width:500px){.opts{grid-template-columns:1fr}.match-grid{grid-template-columns:1fr 1fr}.mi{font-size:.82rem;padding:.55rem .7rem}}
</style>
</head>

/* ═══════════════════════════ QUIZ ENGINE ═══════════════════════════ */
const state={};
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function initQuiz(id){
  state[id]={qs:shuffle(DATA[id].qs),cur:0,score:0,done:false};
  renderQ(id);
}

function renderQ(id){
  const el=document.getElementById('sec-'+id);
  const s=state[id], d=DATA[id];

    const p=Math.round(s.score/s.qs.length*100);

      <div class='r-title'>${msg}</div>
      <div class='r-sub'>Your score:</div>
      <div class='r-big'>${s.score} / ${s.qs.length}</div>
      <div class='r-sub'>${p}% correct</div>
      <button class='retry' onclick="initQuiz('${id}')">🔄 Try Again</button>
    </div>`;
    return;
  }
  const q=s.qs[s.cur];
  const pct=s.cur/s.qs.length*100;
  const opts=shuffle(q.opts);
  const L=['A','B','C','D'];
  el.innerHTML=`
    <div class='sec-head'>
      <div class='sec-title'>${d.title}</div>
      <div class='sec-sub'>${d.sub}</div>
    </div>
    <div class='prog-row'>
      <div class='prog-label'>Q ${s.cur+1}/${s.qs.length}</div>
      <div class='prog-track'><div class='prog-fill' style='width:${pct}%'></div></div>
      <div class='prog-score'>⭐ ${s.score}</div>
    </div>
    <div class='qcard'>
      <div class='qbadge'>${d.badge}</div>
      <div class='qtext'>${q.q}</div>
      <div class='opts' id='opts-${id}'></div>
      <div class='fb' id='fb-${id}'></div>
      <div style='text-align:center'>
        <button class='nxt' id='nxt-${id}' style='display:none' onclick="next('${id}')">
          ${s.cur+1<s.qs.length?'Next Question →':'See Results 🏆'}
        </button>
      </div>
    </div>`;

  const optsEl = document.getElementById('opts-'+id);
  const correctAns = q.a;
  shuffle(q.opts).forEach((o,i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = "<span class='ltr'>"+['A','B','C','D'][i]+"</span>";
    btn.appendChild(document.createTextNode(o));
    btn.addEventListener('click', function(){
      document.querySelectorAll('#opts-'+id+' .opt').forEach(b=>b.disabled=true);
      const fb = document.getElementById('fb-'+id);
      const nxt = document.getElementById('nxt-'+id);
      if(o === correctAns){
        btn.classList.add('ok');
        fb.textContent = '✅ Correct! Well done!';
        fb.className = 'fb show ok';
        state[id].score++;
      } else {
        btn.classList.add('bad');
        fb.textContent = '❌ The correct answer is: ' + correctAns;
        fb.className = 'fb show bad';
        document.querySelectorAll('#opts-'+id+' .opt').forEach(b=>{
          if(b.textContent.trim() === correctAns) b.classList.add('ok');
        });
      }
      nxt.style.display = 'inline-block';
    });
    optsEl.appendChild(btn);
  });
}

function next(id){
  const s=state[id]; s.cur++;
  if(s.cur>=s.qs.length) s.done=true;
  renderQ(id);
}

/* ═══════════════════════════ MATCHING ═══════════════════════════ */
let MS={idx:0,selA:null,selB:null,matchedCount:0,errors:0,pairs:[]};

function initMatch(idx){
  MS={idx,selA:null,selB:null,matchedCount:0,errors:0,pairs:[]};
  renderMatch();
}

function renderMatch(){
  const el=document.getElementById('sec-match');
  const set=MSETS[MS.idx];
  MS.pairs=shuffle(set.pairs);
  MS.colA=shuffle(MS.pairs.map(p=>p.a));
  MS.colB=shuffle(MS.pairs.map(p=>p.b));
  MS.elA=null; MS.elB=null;

  el.innerHTML=`
    <div class='sec-head'>
      <div class='sec-title'>🔗 Matching Game</div>
      <div class='sec-sub'>Click a word on the left, then its match on the right!</div>
    </div>
    <div class='match-wrap'>
      <div class='match-set-tabs' id='mstabs'></div>
      <div class='match-toolbar'>
        <div class='match-info' id='mi-info'>Matched: 0 / ${MS.pairs.length} | Errors: 0</div>
        <button class='match-reset' id='mrst'>🔄 Restart</button>
      </div>
      <div class='match-grid'>
        <div class='match-col'>
          <div class='match-col-lbl'>${set.col1lbl}</div>
          <div id='colA'></div>
        </div>
        <div class='match-col'>
          <div class='match-col-lbl'>${set.col2lbl}</div>
          <div id='colB'></div>
        </div>
      </div>
      <div class='result' id='match-done'>
        <div class='r-emoji'>🎉</div>
        <div class='r-title'>All matched!</div>
        <div class='r-sub' id='match-err-info'>Errors: 0</div>
        <button class='retry' id='mretry'>🔄 Play Again</button>
      </div>
    </div>`;

  document.getElementById('mrst').addEventListener('click',()=>initMatch(MS.idx));
  document.getElementById('mretry').addEventListener('click',()=>initMatch(MS.idx));

  const stContainer=document.getElementById('mstabs');
  MSETS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='mstab'+(i===MS.idx?' on':'');
    b.textContent=s.title;
    b.addEventListener('click',()=>initMatch(i));
    stContainer.appendChild(b);
  });

  const cA=document.getElementById('colA');
  const cB=document.getElementById('colB');
  MS.colA.forEach(w=>{
    const d=document.createElement('div');
    d.className='mi'; d.textContent=w; d.dataset.val=w; d.dataset.side='A';
    d.addEventListener('click',()=>pickMi(d));
    cA.appendChild(d);
  });
  MS.colB.forEach(w=>{
    const d=document.createElement('div');
    d.className='mi'; d.textContent=w; d.dataset.val=w; d.dataset.side='B';
    d.addEventListener('click',()=>pickMi(d));
    cB.appendChild(d);
  });
}

function pickMi(el){
  if(el.classList.contains('matched')) return;
  const side=el.dataset.side;
  if(side==='A'){
    document.querySelectorAll('[data-side="A"]').forEach(m=>{if(!m.classList.contains('matched'))m.classList.remove('sel');});
    MS.elA=el; el.classList.add('sel');
  } else {
    document.querySelectorAll('[data-side="B"]').forEach(m=>{if(!m.classList.contains('matched'))m.classList.remove('sel');});
    MS.elB=el; el.classList.add('sel');
  }
  if(MS.elA && MS.elB){
    const vA=MS.elA.dataset.val, vB=MS.elB.dataset.val;
    const pair=MS.pairs.find(p=>p.a===vA);
    if(pair && pair.b===vB){
      MS.elA.classList.remove('sel'); MS.elA.classList.add('matched');
      MS.elB.classList.remove('sel'); MS.elB.classList.add('matched');
      MS.matchedCount++;
      document.getElementById('mi-info').textContent='Matched: '+MS.matchedCount+' / '+MS.pairs.length+' | Errors: '+MS.errors;
      if(MS.matchedCount===MS.pairs.length){
        setTimeout(()=>{
          document.getElementById('match-err-info').textContent='Errors made: '+MS.errors;
          document.getElementById('match-done').classList.add('show');
        },350);
      }
    } else {
      MS.errors++;
      document.getElementById('mi-info').textContent='Matched: '+MS.matchedCount+' / '+MS.pairs.length+' | Errors: '+MS.errors;
      const a=MS.elA, b=MS.elB;
      a.classList.add('flash-bad'); b.classList.add('flash-bad');
      setTimeout(()=>{a.classList.remove('sel','flash-bad');b.classList.remove('sel','flash-bad');},500);
    }
    MS.elA=null; MS.elB=null;
  }
}

/* ═══════════════════════════ TABS ═══════════════════════════ */
function showTab(id, btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('sec-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='match'){if(!MS.pairs.length)initMatch(0); else renderMatch();}
  else if(!state[id]) initQuiz(id);
}

/* ═══════════════════════════ BOOT ═══════════════════════════ */
initQuiz('u25');
</script>
